# Install as /etc/systemd/system/gunicorn-sekki.service.d/10-security.conf
# only after the jaspen-app identity can read/execute the checkout and venv.
[Service]
User=jaspen-app
Group=jaspen-app
# Replace @DEPLOY_ROOT@ with the absolute DEPLOY_ROOT from /etc/jaspen/deploy.conf
# before installing this drop-in. These are the only writable checkout paths.
Environment=
EnvironmentFile=/etc/jaspen/runtime.env
ReadWritePaths=@DEPLOY_ROOT@/backend/data/user_uploads
ReadWritePaths=@DEPLOY_ROOT@/backend/data/reports
ReadWritePaths=@DEPLOY_ROOT@/backend/connectors_data
ReadWritePaths=@DEPLOY_ROOT@/backend/admin_audit_data
UMask=0077
PrivateTmp=true
NoNewPrivileges=true
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=

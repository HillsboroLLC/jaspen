# Install as /etc/systemd/system/gunicorn-sekki.service.d/10-security.conf
# only after the jaspen-app identity can read/execute the checkout and venv.
[Service]
User=jaspen-app
Group=jaspen-app
EnvironmentFile=/etc/jaspen/runtime.env
UMask=0077
PrivateTmp=true
NoNewPrivileges=true
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=

name: Deploy → Production

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${SERVER_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
      - name: Deploy on DigitalOcean
        run: |
          ssh "${SERVER_USER}@${SERVER_HOST}" "cd ~/sekki-platform && git fetch origin && git pull --ff-only origin main && source backend/venv/bin/activate && pip install -q -r backend/requirements.txt && cd backend && eval export \$(systemctl show gunicorn-sekki.service -p Environment --value) && export PATH=\"\$PATH:/usr/bin:/bin\" && FLASK_APP=wsgi.py flask db upgrade && sudo systemctl restart gunicorn-sekki.service"
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

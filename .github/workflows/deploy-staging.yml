name: Deploy → Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-frontend:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
        env:
          REACT_APP_API_BASE: https://api-dev.jaspen.ai
      - name: Deploy to Vercel (preview)
        run: npx vercel deploy --token "${VERCEL_TOKEN}" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    if: ${{ secrets.DO_HOST != '' && secrets.DO_USERNAME != '' && secrets.DO_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push staging backend image
        if: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jaspen-backend:staging,ghcr.io/${{ github.repository_owner }}/jaspen-backend:staging-${{ github.sha }}
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${DO_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DO_HOST}" >> ~/.ssh/known_hosts
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
      - name: Deploy staging on DigitalOcean
        run: |
          ssh "${DO_USERNAME}@${DO_HOST}" "cd ~/jaspen-dev && git fetch origin && git pull --ff-only origin develop && sudo systemctl restart gunicorn-jaspen-dev.service"
        env:
          DO_USERNAME: ${{ secrets.DO_USERNAME }}
          DO_HOST: ${{ secrets.DO_HOST }}
